services:
  frontend:
    build:
      context: .
      target: frontend
    ports:
      - "5173:5173"
    working_dir: /app/src/frontend
    command: bun run dev

  backend:
    build:
      context: .
      target: backend
    ports:
      - "3000:3000"
    working_dir: /app/src/backend
    command: bun run index.ts